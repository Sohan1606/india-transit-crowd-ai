services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # The image carries the registry, data/processed and data/inference, so each family resolves its own
      # dataset and artifact directory. TRANSITCROWD_MODEL/DATA/SOURCE_METADATA are intentionally unset:
      # they select the single-family path. Set CORS_ORIGINS to the browser origin(s) that may call this.
      CORS_ORIGINS: http://localhost:8080
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
