services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TRANSITCROWD_MODEL: /app/backend/models/bengaluru-namma-metro/transitcrowd.joblib
      TRANSITCROWD_DATA: /app/data/processed/namma_metro_station_hourly.csv
      TRANSITCROWD_SOURCE_METADATA: /app/data/processed/namma_metro_station_hourly.metadata.json
      CORS_ORIGINS: http://localhost:8080
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
